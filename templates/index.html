<!DOCTYPE html>
<html>
<head>
  <title>Emotion Detector</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
    h1 { color: #1e3a8a; }
    textarea { width: 100%; max-width: 600px; height: 100px; padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; }
    button { background-color: #2563eb; color: white; padding: 10px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    #system_response { margin-top: 25px; font-size: 17px; font-weight: 500; }
  </style>
  <script>
    function runSentimentAnalysis() {
      var textToAnalyze = document.getElementById("textToAnalyze").value;
      var xhttp = new XMLHttpRequest();
      xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          document.getElementById("system_response").innerHTML = xhttp.responseText;
        }
      };
      xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(textToAnalyze), true);
      xhttp.send();
    }
  </script>
</head>
<body>
  <h1>Emotion Detector</h1>
  <p>Enter text to analyze emotions:</p>
  <textarea id="textToAnalyze" placeholder="Type something here..."></textarea><br>
  <button onclick="runSentimentAnalysis()">Run Sentiment Analysis</button>
  <div id="system_response"></div>
</body>
</html>
